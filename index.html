<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mostafa Safwat Ibrahim — Full-Stack Developer & Systems Architect</title>
    <meta
      name="description"
      content="25+ years across datacenters, infrastructure and system architecture, now building full-stack products. Portfolio with live demos."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main" tabindex="-1">
      <section id="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Mostafa Safwat Ibrahim</h1>
      </section>
      <section id="impact" aria-label="Career in numbers"></section>
      <section id="stack" aria-labelledby="stack-title">
        <h2 id="stack-title">The Stack of a Career</h2>
      </section>
      <section id="career" aria-labelledby="career-title">
        <h2 id="career-title">Career timeline</h2>
      </section>
      <section id="developer" aria-labelledby="dev-title">
        <h2 id="dev-title">Full-stack developer</h2>
      </section>
      <section id="work" aria-labelledby="work-title">
        <h2 id="work-title">Selected work</h2>
      </section>
      <section id="built" aria-labelledby="built-title">
        <h2 id="built-title">How this site is built</h2>
      </section>
      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Contact</h2>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
